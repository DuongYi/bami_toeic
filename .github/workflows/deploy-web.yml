# Build bản web (Flutter) và đăng lên GitHub Pages mỗi khi push lên main.
# Cấu hình Supabase: lấy từ repository secret SUPABASE_URL / SUPABASE_KEY nếu có,
# không thì dùng env.public.json trong repo (chỉ chứa URL + khoá publishable, vốn công khai
# trong bản web; dữ liệu được bảo vệ bằng RLS).
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Tạo env.json (secrets hoặc env.public.json)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_KEY" \
              '{SUPABASE_URL: $url, SUPABASE_KEY: $key}' > env.json
            echo "Dùng cấu hình từ repository secrets"
          else
            cp env.public.json env.json
            echo "Không có secrets → dùng env.public.json"
          fi
          # Chặn nhầm khoá bí mật (service_role / sb_secret_) vào bản web công khai.
          key=$(jq -r .SUPABASE_KEY env.json)
          case "$key" in
            sb_publishable_*) ;;
            *) echo "SUPABASE_KEY phải là khoá publishable (sb_publishable_…)"; exit 1 ;;
          esac

      # Trang dự án nằm ở /<tên repo>/ nên base-href phải khớp.
      - run: >
          flutter build web --release --no-wasm-dry-run
          --dart-define-from-file=env.json
          --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
