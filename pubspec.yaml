name: bami_toeic
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  just_audio: ^0.10.6
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^4.0.7
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  path_provider: ^2.1.6
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  supabase: ^2.16.2
  build_runner: ^2.16.2
  retrofit_generator: ^10.2.11
  json_serializable: ^6.14.1
  freezed: ^4.0.2
  riverpod_generator: ^4.0.9

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/bami_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/logo/bami_logo.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/logo/bami_logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/logo/bami_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
